version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: dflayer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dflayer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dflayer_password}
      POSTGRES_DB: ${POSTGRES_DB:-dflayer_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dflayer_user} -d ${POSTGRES_DB:-dflayer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dflayer_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dflayer_api
    restart: unless-stopped
    environment:
      # Project Configuration
      PROJECT_NAME: ${PROJECT_NAME:-DflayerApi}
      VERSION: ${VERSION:-0.1.0}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # Database - Uses service name 'db' from docker-compose
      DATABASE_URL: postgresql://${POSTGRES_USER:-dflayer_user}:${POSTGRES_PASSWORD:-dflayer_password}@db:5432/${POSTGRES_DB:-dflayer_db}
      
      # CORS
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      
      # Server
      DEBUG: ${DEBUG:-True}
      
      # SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-}
      
      # AWS S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      
      # Transcoding
      TRANSCODING_WORKER_COUNT: ${TRANSCODING_WORKER_COUNT:-4}
      TRANSCODING_MAX_RETRIES: ${TRANSCODING_MAX_RETRIES:-3}
      TRANSCODING_QUEUE_SIZE: ${TRANSCODING_QUEUE_SIZE:-100}
      FFMPEG_PATH: ${FFMPEG_PATH:-/usr/bin/ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-/usr/bin/ffprobe}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount code for development (comment out in production)
      - .:/app
      # Exclude node_modules and other unnecessary files
      - /app/__pycache__
      - /app/.pytest_cache
    networks:
      - dflayer_network
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 5 &&
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Starting FastAPI application...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:
    driver: local

networks:
  dflayer_network:
    driver: bridge

